{% extends 'base.html' %}
{% block content %}
    <h2>Thêm sản phẩm mới</h2>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <p>Tên sản phẩm:<br>
            <input type="text" name="title" required style="width: 100%; padding: 8px; box-sizing: border-box;">
        </p>
        <p>Giá ($):<br>
            <input type="number" step="0.01" name="price" required style="width: 100%; padding: 8px; box-sizing: border-box;">
        </p>
        <p>Hình ảnh:<br>
            <input type="file" name="image" accept="image/*" required>
        </p>
        <button type="submit" style="padding: 10px 20px; background-color: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px;">
            Lưu sản phẩm
        </button>
    </form>
    <br>
    <a href="{% url 'list_product' %}" style="color: #007bff; text-decoration: none;">Quay lại danh sách</a>
{% endblock %}
